[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratespikegs"
version = "0.1.0"
description = "Rate-guided Gaussian splatting for spike stream reconstruction"
readme = "README.md"
requires-python = ">=3.9,<3.11"

[project.urls]
Repository = "https://github.com/styufo/RateSpikeGS"

[tool.setuptools.packages.find]
include = ["bad_gaussians*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py39"]
